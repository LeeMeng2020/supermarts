name: Aeon flow 5 macos (aeon-branch)

on:
  workflow_dispatch:
  schedule:
    - cron: '53 22 * * *'
    - cron: '13 04 * * *'

jobs:
  setup:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: aeon-branch
          path: .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'

      - name: Install system dependencies
        run: |
          brew update
          brew install coreutils
          brew install p7zip
          brew install git curl
          brew install xquartz   # provides X11 server

      - name: Start virtual display
        run: |
          export DISPLAY=:99
          /opt/X11/bin/Xvfb :99 -screen 0 1920x1080x24 &
          echo "Virtual display started"

      - name: Display system information
        run: |
          echo "macOS version:"
          sw_vers
          echo "Python version:"
          python3 -V
          echo "IP address:"
          curl --no-progress-meter https://ipinfo.io/ip

      - name: Unzip .7z, copy categories and requirements
        run: |
          7z x runner-src/gather-aeon-src.7z -p${{ secrets.ZIP_PW }}
          cp runner-src/requirements* .
          cp runner-src/aeon-categories* .

      - name: pip install
        run: pip3 install -r requirements_b.txt

      - name: Run script and validate output. With retry, timeout.
        timeout-minutes: 45
        run: |
          check_output_file() {
            local file=$1
            local minsize=$2
            if [ ! -f "$file" ]; then
              echo "** Output file does not exist **"
              return 1
            fi
            filesize=$(stat -f%z "$file")   # macOS syntax
            if [ $filesize -lt $minsize ]; then
              echo "** Output file too small ($filesize bytes) **"
              return 1
            fi
            echo "Validation passed: output file seems OK."
            return 0
          }

          run_with_timeout() {
            local categories=$1
            local output=$2
            local timeoutMinutes=$3
            local attemptLabel=$4

            echo "=== $attemptLabel ==="
            gtimeout ${timeoutMinutes}m python3 -u aeon_cdp_args_040.py -c "$categories" -o "$output"
            check_output_file "$output" 5000
          }

          perAttemptTimeout=21

          if ! run_with_timeout "aeon-categories-5.txt" "aeon-out-part5.csv" $perAttemptTimeout "First attempt"; then
            echo "First attempt failed or timed out. Retrying after 36 seconds..."
            sleep 36
            if ! run_with_timeout "aeon-categories-5.txt" "aeon-out-part5.csv" $perAttemptTimeout "Second attempt"; then
              echo "** Retry failed. Aborting. **"
              exit 1
            fi
          fi

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes before push
        run: git pull origin aeon-branch --rebase

      - name: Commit and push generated files
        run: |
          cp aeon-out-part5.csv raw_data/
          git add raw_data/aeon-out-part5.csv
          git commit -m "Automated: Add generated Aeon file" || echo "No changes to commit"
          git push origin aeon-branch
