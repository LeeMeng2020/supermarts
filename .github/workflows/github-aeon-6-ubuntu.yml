name: Aeon flow 6 ubuntu (aeon-branch)

on:
  workflow_dispatch: # manual trigger ability

env:
  OUT_FILE: aeon-out-part6.csv
  CATEGORIES_FILE: aeon-categories-6.txt
  MIN_SIZE: 5000

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: aeon-branch
          path: . # Checkout to the root
          fetch-depth: 0
          filter: blob:none

      # Attempt 1: If a 504 gateway timeout occurs, continue instead of failing the job
      - name: Set up Python (Attempt 1)
        id: setup-python-1
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          cache: 'pip'
          cache-dependency-path: runner-src/requirements_b.txt

      # Pause for 35 seconds to give GitHub's backend servers time to recover
      - name: Wait before retry
        if: steps.setup-python-1.outcome == 'failure'
        run: sleep 35

      # Attempt 2: Runs only if the first attempt failed
      - name: Set up Python (Retry Fallback)
        if: steps.setup-python-1.outcome == 'failure'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: runner-src/requirements_b.txt          

      - name: Check if recent file already exists
        id: freshness_check
        run: |
          set -uo pipefail
          FILE="raw_data/${OUT_FILE}"
          MAX_AGE=$((60 * 58))

          # Fail-open default; if a later line writes skip=true, the last write wins
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --quiet || { echo "::warning::unshallow failed, scraping"; exit 0; }
          fi
          git pull --ff-only origin aeon-branch || { echo "::warning::pull failed, scraping"; exit 0; }

          LAST=$(git log -1 --format='%at %h' -- "$FILE")
          if [ -z "$LAST" ]; then
            echo "No previous file found, scraping needed."
            exit 0
          fi

          LAST_TS=${LAST% *}
          LAST_HASH=${LAST#* }
          AGE=$(( $(date +%s) - LAST_TS ))
          MSG="Last commit touching $FILE: $LAST_HASH, age ${AGE}s (limit ${MAX_AGE}s)"
          echo "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

          if [ "$AGE" -ge 0 ] && [ "$AGE" -lt "$MAX_AGE" ]; then
            echo "File recently updated, no scraping needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "File stale, scraping needed."
          fi

      - name: Install system dependencies
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt update || {
            echo "::warning::apt update failed; waiting 33 seconds before one retry"
            sleep 33
            sudo apt update || exit $?
          }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y p7zip-full xvfb

      - name: Start virtual display
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "Virtual display started"
          echo "DISPLAY=:99" >> $GITHUB_ENV
          sleep 1

      - name: Display system information
        run: |
          echo "Linux version:"
          uname -a
          echo "Architecture:"
          uname -m
          echo "Python version:"
          python -V
          echo "IP address:"
          curl --no-progress-meter https://ipinfo.io/ip

      - name: Unzip .7z, copy categories and requirements
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          7z x runner-src/gather-aeon-src.7z -p${{ secrets.ZIP_PW }}
          cp runner-src/requirements* .
          cp runner-src/aeon-categories* .

      - name: pip install
        if: steps.freshness_check.outputs.skip != 'true'
        run: pip install -r requirements_b.txt
        
      - name: Random delay
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          DELAY=$((RANDOM % 6))   # Random number between 0 and 5
          echo "Random sleep for $DELAY seconds..."
          sleep $DELAY        

      # Attempt 1: if the script or validation fails, continue instead of failing the job
      - name: Run script (Attempt 1)
        id: run-script-1
        if: steps.freshness_check.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 19
        run: |
          rm -f "$OUT_FILE"
          python -u aeon_cdp_args_040.py -c "$CATEGORIES_FILE" -o "$OUT_FILE"
          if [ ! -f "$OUT_FILE" ] || [ "$(stat -c%s "$OUT_FILE")" -lt "$MIN_SIZE" ]; then
            echo "** Output file missing or smaller than $MIN_SIZE bytes **"
            exit 1
          fi

      # Pause for 50 seconds before retrying
      - name: Wait before retry
        if: steps.run-script-1.outcome == 'failure'
        run: sleep 52

      # Attempt 2: runs only if attempt 1 failed. Final attempt; if it fails, the job fails.
      - name: Run script (Retry)
        if: steps.run-script-1.outcome == 'failure'
        timeout-minutes: 19
        run: |
          rm -f "$OUT_FILE"
          python -u aeon_cdp_args_040.py -c "$CATEGORIES_FILE" -o "$OUT_FILE"
          if [ ! -f "$OUT_FILE" ] || [ "$(stat -c%s "$OUT_FILE")" -lt "$MIN_SIZE" ]; then
            echo "** Output file missing or smaller than $MIN_SIZE bytes **"
            exit 1
          fi

      - name: Set up Git
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push generated files
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          cp "$OUT_FILE" raw_data/
          git add "raw_data/$OUT_FILE"
          git commit -m "Automated: Add generated Aeon 6 file" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase origin aeon-branch && git push origin aeon-branch && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "** Push failed **"; exit 1
