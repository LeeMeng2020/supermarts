name: Village brief-4 flow (gather-branch)

on:
  workflow_dispatch: # manual trigger ability

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Grant write permissions for pushing changes
    
    env:
      VILLAGE_OUT_FILE: village-brief-4.csv   # Centralized filename variable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: gather-branch # Specify gather-branch directly for the primary checkout
          path: . # CHANGE: Checkout to the root of the runner's dir
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          cache: 'pip'
          cache-dependency-path: runner-src/village_requirements.txt

      - name: Check if recent file already exists
        id: freshness_check
        run: |
          set -uo pipefail
          FILE="raw_data/$VILLAGE_OUT_FILE"
          MAX_AGE=$((60 * 58))

          # Fail-open default; if a later line writes skip=true, the last write wins
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --quiet || { echo "::warning::unshallow failed, scraping"; exit 0; }
          fi
          git pull --ff-only origin gather-branch || { echo "::warning::pull failed, scraping"; exit 0; }

          LAST=$(git log -1 --format='%at %h' -- "$FILE")
          if [ -z "$LAST" ]; then
            echo "No previous file found, scraping needed."
            exit 0
          fi

          LAST_TS=${LAST% *}
          LAST_HASH=${LAST#* }
          AGE=$(( $(date +%s) - LAST_TS ))
          MSG="Last commit touching $FILE: $LAST_HASH, age ${AGE}s (limit ${MAX_AGE}s)"
          echo "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

          if [ "$AGE" -ge 0 ] && [ "$AGE" -lt "$MAX_AGE" ]; then
            echo "File recently updated, no scraping needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "File stale, scraping needed."
          fi

      - name: Display system information
        run: |
          echo "Ubuntu version:"
          lsb_release -a
          echo "Python version"
          python -V
          echo "IP address"
          curl --no-progress-meter https://api.ipify.org
          
      - name: Update package lists
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt update
          apt list --upgradable        
        
      - name: Install basic utilities and 7-zip
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y \
            build-essential \
            python3-problem-report \
            linux-tools-common xvfb
          # linux-libc-dev
          # sudo apt-get install -y p7zip-full curl 
          # sudo apt-get install -y chromium-browser

      - name: Unzip gather-village
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          7z x runner-src/gather-village-src.7z -p${{ secrets.ZIP_PW }}
          cp -v runner-src/village-categories* .
          cp -v runner-src/village_requirements.txt .
          cp -v runner-src/vill_giza_brief* .
          ls -l

      - name: pip install
        if: steps.freshness_check.outputs.skip != 'true'
        run: pip install -r village_requirements.txt
        
      - name: Random delay
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          DELAY=$((RANDOM % 5))   # Random number between 0 and 4
          echo "Random sleep for $DELAY seconds..."
          sleep $DELAY     

      - name: Install Playwright deps
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Run script
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          echo "running script"
          python vill_005.py --config vill_giza_brief_4_settings.json
          
      - name: Validate output file
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          echo "Checking if $VILLAGE_OUT_FILE exists and is larger than 20 KB..."
          if [ ! -f "$VILLAGE_OUT_FILE" ]; then
            echo "❌ File does not exist: $VILLAGE_OUT_FILE"
            exit 1
          fi
          FILESIZE=$(stat -c%s "$VILLAGE_OUT_FILE")
          if [ "$FILESIZE" -lt 20000 ]; then
            echo "❌ File size is too small: ${FILESIZE} bytes"
            exit 1
          fi
          echo "✅ File exists and is larger than 20 KB: ${FILESIZE} bytes"

      - name: Set up Git
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
   
      - name: Commit and push generated files
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          mv "$VILLAGE_OUT_FILE" raw_data/
          git add raw_data/"$VILLAGE_OUT_FILE"
          git add processed/v*
          git commit -m "Automated: Add generated Village files (brief-4)" || echo "No changes to commit"
          for i in 1 2 3; do
            git pull --rebase origin gather-branch && git push origin gather-branch && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "** Push failed **"; exit 1
