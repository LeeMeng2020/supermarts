name: Village brief-4 flow (gather-branch)

on:
  workflow_dispatch: # manual trigger ability

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Grant write permissions for pushing changes
    
    env:
      VILLAGE_OUT_FILE: village-brief-4.csv   # Centralized filename variable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: gather-branch # Specify gather-branch directly for the primary checkout
          path: . # CHANGE: Checkout to the root of the runner's working directory      

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          cache: 'pip'
          cache-dependency-path: runner-src/village_requirements.txt

      - name: Check if recent file already exists
        id: freshness_check
        run: |
          git pull origin gather-branch --rebase

          FILE="raw_data/$VILLAGE_OUT_FILE"
          MAX_AGE=$((60 * 58))
          NOW=$(date +%s)

          LAST_COMMIT=$(git log -1 --format=%ct -- "$FILE")

          if [ -z "$LAST_COMMIT" ]; then
            echo "No previous file found, scraping needed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE=$((NOW - LAST_COMMIT))

          if [ "$AGE" -lt "$MAX_AGE" ]; then
            echo "File recently updated, no scraping needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "File older than 58 minutes, scraping needed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Display system information
        run: |
          echo "Ubuntu version:"
          lsb_release -a
          echo "Python version"
          python -V
          echo "IP address"
          curl --no-progress-meter https://api.ipify.org
          
      - name: Update package lists
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt update
          apt list --upgradable        
        
      - name: Install basic utilities and 7-zip
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            build-essential \
            python3-problem-report \
            linux-tools-common linux-libc-dev \
            p7zip-full xvfb curl \
            chromium-browser
          
      - name: Unzip gather-village-b.7z
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          7z x runner-src/gather-village-src.7z -p${{ secrets.ZIP_PW }}
          cp -v runner-src/village-categories* .
          cp -v runner-src/village_requirements.txt .
          cp -v runner-src/vill_giza_brief* .
          ls -l

      - name: pip install
        if: steps.freshness_check.outputs.skip != 'true'
        run: pip install -r village_requirements.txt
        
      - name: Random delay
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          DELAY=$((RANDOM % 6))   # Random number between 0 and 5
          echo "Random sleep for $DELAY seconds..."
          sleep $DELAY     

      - name: Install Playwright deps
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 fonts-liberation
          playwright install chromium

      - name: Run script
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          echo "running script"
          python vill_005.py --config vill_giza_brief_4_settings.json
          
      - name: Validate output file
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          echo "Checking if $VILLAGE_OUT_FILE exists and is larger than 20 KB..."
          if [ ! -f "$VILLAGE_OUT_FILE" ]; then
            echo "❌ File does not exist: $VILLAGE_OUT_FILE"
            exit 1
          fi
          FILESIZE=$(stat -c%s "$VILLAGE_OUT_FILE")
          if [ "$FILESIZE" -lt 20000 ]; then
            echo "❌ File size is too small: ${FILESIZE} bytes"
            exit 1
          fi
          echo "✅ File exists and is larger than 20 KB: ${FILESIZE} bytes"

      - name: Set up Git
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes before push
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          git pull origin gather-branch --rebase

    
      - name: Commit and push generated files
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          mkdir -p raw_data
          mv "$VILLAGE_OUT_FILE" raw_data/
          git add raw_data/"$VILLAGE_OUT_FILE"
          git add processed/v*
          git commit -m "Automated: Add generated Village files (brief-4)" || echo "No changes to commit"
          git push origin gather-branch
