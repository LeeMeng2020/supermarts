name: Village flow (gather-branch)

on:
  workflow_dispatch: # manual trigger ability

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Grant write permissions for pushing changes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: gather-branch # Specify gather-branch directly for the primary checkout
          path: . # CHANGE: Checkout to the root of the runner's working directory      

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'
          cache: 'pip'
          cache-dependency-path: runner-src/village_requirements.txt

      - name: Display system information
        run: |
          echo "Ubuntu version:"
          lsb_release -a
          echo "Python version"
          python -V
          echo "IP address"
          curl --no-progress-meter https://api.ipify.org
          
      - name: Update package lists
        run: |
          sudo apt update
          apt list --upgradable        
        
      - name: Install basic utilities and 7-zip
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            build-essential \
            python3-problem-report \
            linux-tools-common linux-libc-dev \
            p7zip-full xvfb curl \
            chromium
           
      - name: Unzip gather-village-b.7z
        run: |
          7z x runner-src/gather-village-src.7z -p${{ secrets.ZIP_PW }}
          cp -v runner-src/village-categories.txt .
          cp -v runner-src/village_requirements.txt .
          cp -v runner-src/vill_giza_settings.json .
          cp -v runner-src/village_fixer.ini .
          ls -l

      - name: pip install
        run: | 
          pip install -r village_requirements.txt
          playwright install chromium

      - name: Pull latest changes and village-briefx files, check age
        run: |
          MAX_AGE=$((9 * 60 * 60))
          NOW=$(date +%s)
          FOUND_FRESH=0

          for FILE in raw_data/village-brief-*.csv; do
            LAST_COMMIT=$(git log -1 --format=%ct -- "$FILE")

            if [ -z "$LAST_COMMIT" ]; then
              echo "❌ Cannot determine last commit for $FILE"
              continue
            fi

            AGE=$((NOW - LAST_COMMIT))

            if [ "$AGE" -le "$MAX_AGE" ]; then
              echo "✅ $FILE last updated $((AGE / 3600)) hours ago"
              FOUND_FRESH=1
            else
              echo "⚠️ $FILE last updated $((AGE / 3600)) hours ago"
            fi
          done

          if [ "$FOUND_FRESH" -eq 0 ]; then
            echo "❌ No files less than 9 hours old."
            exit 1
          fi

          git pull origin gather-branch --rebase
          cp -v raw_data/village-brief* .

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 8))   # Random number between 0 and 7
          echo "Random sleep for $DELAY seconds..."
          sleep $DELAY     
          
      - name: Run script
        timeout-minutes: 48
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          CHROME_BIN: /usr/bin/chromium
        run: |
          echo "running script"
          python vill_005.py
          
      - name: Validate output file
        run: |
          FILE="village-gather.csv"
          echo "Checking if $FILE exists and is larger than 100 KB..."
          if [ ! -f "$FILE" ]; then
            echo "❌ File does not exist: $FILE"
            exit 1
          fi
          FILESIZE=$(stat -c%s "$FILE")
          if [ "$FILESIZE" -lt 101500 ]; then
            echo "❌ File size is too small: ${FILESIZE} bytes"
            exit 1
          fi
          echo "✅ File exists and is larger than 100 KB: ${FILESIZE} bytes"

      - name: Run processing script
        run: |
          echo "running processing script"
          python village_fixer_036.py

      - name: Pull latest changes before push
        run: |
          git pull origin gather-branch --rebase

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Commit and push generated files
        run: |
          mkdir -p raw_data
          cp village-gather.csv raw_data/
          cp village-output* processed/
          git add raw_data/village-gather.csv
          git add processed/v*

          git commit -m "Automated: Add generated Village files" || echo "No changes to commit"
          git push origin
          