name: Village Runner

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

      config:
        required: true
        type: string

      outfile:
        required: true
        type: string

      commit_suffix:
        required: true
        type: string

jobs:
  setup:
    runs-on: ${{ inputs.runner }}

    env:
      VILLAGE_OUT_FILE: ${{ inputs.outfile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          ref: gather-branch # Specify gather-branch directly for the primary checkout
          path: . # CHANGE: Checkout to the root of the runner's working directory      

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.13'

      - name: Check if recent file already exists
        id: freshness_check
        run: |
          git pull origin gather-branch --rebase

          FILE="raw_data/$VILLAGE_OUT_FILE"
          MAX_AGE=$((60 * 58))
          NOW=$(date +%s)

          LAST_COMMIT=$(git log -1 --format=%ct -- "$FILE")

          if [ -z "$LAST_COMMIT" ]; then
            echo "No previous file found, scraping needed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE=$((NOW - LAST_COMMIT))

          if [ "$AGE" -lt "$MAX_AGE" ]; then
            echo "File recently updated, no scraping needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "File older than 58 minutes, scraping needed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Display system information
        run: |
          echo "Ubuntu version:"
          lsb_release -a
          echo "Python version"
          python -V
          echo "IP address"
          curl --no-progress-meter https://api.ipify.org
          
      - name: Update package lists
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt update
          apt list --upgradable        
        
      - name: Install basic utilities and 7-zip
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y \
            build-essential \
            python3-problem-report \
            linux-tools-common linux-libc-dev \
            p7zip-full xvfb curl \
            chromium-browser
          
      - name: Unzip gather-village-b.7z
        if: steps.freshness_check.outputs.skip != 'true'
        env:
          ZIP_PW: ${{ secrets.ZIP_PW }}
        run: |
          test -n "$ZIP_PW" || { echo "ZIP_PW secret is empty"; exit 1; }
          7z x runner-src/gather-village-src.7z -p"$ZIP_PW"
          cp -v runner-src/village-categories* .
          cp -v runner-src/village_requirements.txt .
          cp -v runner-src/vill_giza_brief* .
          ls -l

      - name: pip install
        if: steps.freshness_check.outputs.skip != 'true'
        run: pip install -r village_requirements.txt
        
      - name: Random delay
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          DELAY=$((RANDOM % 5))   # Random number between 0 and 4
          echo "Random sleep for $DELAY seconds..."
          sleep $DELAY     

      - name: Install Playwright deps
        if: steps.freshness_check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 fonts-liberation
          playwright install chromium

      - name: Run script
        run: |
          python vill_005.py --config "${{ inputs.config }}"

      - name: Commit and push generated files
        run: |
          git commit -m "Automated: Add generated Village files (${{ inputs.commit_suffix }})" \
            || echo "No changes to commit"
